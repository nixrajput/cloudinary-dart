name: Bug Report
description: File a bug report for the cloudinary package
title: "[Bug]: "
labels: ["bug"]
assignees: ["nixrajput"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Before submitting, please check the [existing issues](https://github.com/nixrajput/cloudinary-dart/issues) to avoid duplicates.
        **Never paste your API secret, API key or a signed URL you still use.** Redact them from code and logs; this issue is public.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the package is affected?
      multiple: false
      options:
        - Uploading (UploadApi)
        - Delivery URLs and transformations
        - Admin API
        - Search API
        - Signing and auth tokens
        - Verifying webhooks
        - Errors, retries and HTTP transport
        - Configuration (CloudinaryConfig, CLOUDINARY_URL)
        - Types / API
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you see, and what did you expect?
      placeholder: "Expected: ... Actual: ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal snippet plus what Cloudinary returned. Smaller repros get fixed faster.
      placeholder: |
        1. Create the client from `CLOUDINARY_URL`
        2. Upload a 2 MB JPEG with `folder: 'avatars'`
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: cloudinary version
      description: The version of this package you are running.
      placeholder: "e.g. 2.1.1"
    validations:
      required: true

  - type: textarea
    id: sdk
    attributes:
      label: Dart or Flutter version
      description: Output of `dart --version`, or `flutter --version` in a Flutter app.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: Where do you see the bug?
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
        - Server / CLI (Dart VM)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste the exception and stack trace, with credentials redacted. Formatted as code.
      render: shell

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue you agree to follow our [Code of Conduct](https://github.com/nixrajput/cloudinary-dart/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
