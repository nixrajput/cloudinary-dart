name: Feature Request
description: Suggest an improvement or new feature for the cloudinary package
title: "[Feature Request]: "
labels: ["enhancement"]
assignees: ["nixrajput"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
        Before submitting, check [existing issues](https://github.com/nixrajput/cloudinary-dart/issues) and [discussions](https://github.com/nixrajput/cloudinary-dart/discussions) to see if it has already been proposed.

  - type: dropdown
    id: area
    attributes:
      label: Scope / area
      description: Which part of the package does this relate to?
      multiple: false
      options:
        - Upload API
        - Delivery URLs and transformations
        - Admin API (a missing endpoint)
        - Search API
        - Signing and auth tokens
        - HTTP (retries, progress, transport)
        - Types / API ergonomics
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Why is it needed? For a missing endpoint, link Cloudinary's reference page for it.
      placeholder: "When managing my media, I find it hard to ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like to see. A sketch of the code you wish you could write helps most.
      placeholder: |
        ```dart
        // the API I wish existed
        await cloudinary.someMethod(...)
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you use today, or alternative approaches you have thought about?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information or references that would help.

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue you agree to follow our [Code of Conduct](https://github.com/nixrajput/cloudinary-dart/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
