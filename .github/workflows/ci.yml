name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Use Flutter (it bundles the Dart SDK) so packages whose example/ depends
      # on flutter_test resolve correctly; dart-only packages still work.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
      - name: Test
        run: |
          if [ -d test ] && grep -rqlE 'test\(|testWidgets\(' test; then
            dart test
          else
            echo "no test cases found - skipping"
          fi
      - name: Test on the web (dart2js and dart2wasm)
        # Tests that read repository files are @TestOn('vm') and skip here.
        run: |
          dart test -p chrome
          dart test -p chrome -c dart2wasm
      - name: Example tests
        # Layout at phone to desktop sizes, plus the demo's live parts.
        run: cd example && flutter test
      - name: Coverage
        run: |
          dart pub global activate coverage 1.16.1
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --check-ignore
          scripts/coverage.sh 100

  floor:
    name: floor (Dart 3.13.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Flutter 3.47.0 bundles Dart 3.13.0, the SDK floor in pubspec.yaml.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test
