<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 32 32">
  <title>cloudinary</title>
  <rect width="32" height="32" rx="7" fill="#141118" />
  <!-- An upload rising into the cloud, which is the package's round trip: amber is the file
       going up, violet the cloud that stores and delivers it. The arrow is cut out of the cloud
       in the tile colour so it still reads at 32 px. Same tile and palette as the other packages. -->
  <g fill="#9b8cff">
    <circle cx="16" cy="12.8" r="6" />
    <circle cx="10.5" cy="16.3" r="4.5" />
    <circle cx="21.5" cy="16.3" r="4.5" />
    <rect x="10.5" y="16.3" width="11" height="4.5" />
  </g>
  <path d="M16 26 V14.8 M12.2 18.6 L16 14.8 L19.8 18.6" fill="none" stroke="#141118" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M16 26 V14.8 M12.2 18.6 L16 14.8 L19.8 18.6" fill="none" stroke="#f0a868" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
